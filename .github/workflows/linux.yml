name: Linux desktop build and tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            deb_arch: amd64
          - arch: arm64
            deb_arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build ${{ matrix.arch }} Debian package
        shell: bash
        run: |
          set -o pipefail
          npm run dist:linux -- --${{ matrix.arch }} 2>&1 | tee "$RUNNER_TEMP/nexus-linux-build.log" || {
            tail -n 40 "$RUNNER_TEMP/nexus-linux-build.log"
            exit 1
          }
      - name: Check package architecture
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(release/*.deb)
          test "${#packages[@]}" -eq 1
          dpkg-deb --info "${packages[0]}"
          test "$(dpkg-deb -f "${packages[0]}" Architecture)" = "${{ matrix.deb_arch }}"
          dpkg-deb -f "${packages[0]}" Depends | grep -q "libglib2.0-bin"
      - name: Smoke test unpacked x64 application
        if: matrix.arch == 'x64'
        shell: bash
        run: |
          set -euo pipefail
          exe=$(find release/linux-unpacked -maxdepth 1 -type f -iname nexus -print -quit)
          if [ -z "$exe" ]; then
            echo "::error::Packaged NEXUS executable not found"
            ls -la release/linux-unpacked
            exit 1
          fi
          # Hosted CI's Chromium sandbox is unavailable; this flag is for the CI runner only.
          if ! timeout 60s xvfb-run -a "$exe" --no-sandbox --nexus-smoke-test >"$RUNNER_TEMP/nexus-smoke.log" 2>&1; then
            cat "$RUNNER_TEMP/nexus-smoke.log"
            message=$(tail -n 30 "$RUNNER_TEMP/nexus-smoke.log" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Linux smoke test failed::$message"
            exit 1
          fi
      - name: Install, launch and remove x64 Debian package
        if: matrix.arch == 'x64'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(release/*.deb)
          sudo apt-get update -qq
          sudo apt-get install -y "./${packages[0]}"
          test -x /usr/bin/nexus
          dpkg-query -L nexus-desktop | grep -q '^/usr/share/applications/.*\.desktop$'
          # This tests the installed binary on an ephemeral CI runner, not ChromeOS.
          if ! timeout 60s xvfb-run -a /usr/bin/nexus --no-sandbox --nexus-smoke-test >"$RUNNER_TEMP/nexus-installed-smoke.log" 2>&1; then
            cat "$RUNNER_TEMP/nexus-installed-smoke.log"
            message=$(tail -n 30 "$RUNNER_TEMP/nexus-installed-smoke.log" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Installed Linux smoke test failed::$message"
            exit 1
          fi
          sudo apt-get remove -y nexus-desktop
          test ! -e /usr/bin/nexus
      - uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Linux-${{ matrix.arch }}-deb
          path: release/*.deb
          if-no-files-found: error
