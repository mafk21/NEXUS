name: Windows build and tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify release version can be determined
        run: node scripts/release-tag.cjs
      - run: npm ci
      - name: Audit all dependencies
        run: npm audit
      - run: npm test
      - name: Build Windows installer
        shell: pwsh
        run: |
          # Keep the native exit code while streaming output and exposing the failure in annotations.
          $PSNativeCommandUseErrorActionPreference = $false
          npm run dist:win 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/nexus-build.log"
          $buildExitCode = $LASTEXITCODE
          if ($buildExitCode -ne 0) {
            $tail = (Get-Content "$env:RUNNER_TEMP/nexus-build.log" -Tail 40) -join "`n"
            $escaped = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows installer build failed::$escaped"
            exit $buildExitCode
          }
      - name: Smoke test packaged app (no system changes)
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'release\win-unpacked\NEXUS.exe'
          $process = Start-Process -FilePath $exe -ArgumentList '--nexus-smoke-test' -PassThru
          if (-not $process.WaitForExit(45000)) { $process.Kill(); throw 'NEXUS smoke test timed out' }
          if ($process.ExitCode -ne 0) { throw "NEXUS smoke test failed with exit code $($process.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Windows-installer
          path: release/*.exe
          if-no-files-found: error
